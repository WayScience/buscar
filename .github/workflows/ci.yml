name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Published GitHub releases trigger the PyPI Trusted Publishing job below.
  release:
    types: [published]

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Run pre-commit (required)
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files --show-diff-on-failure

  test:
    needs: pre-commit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Run tests with coverage (Ubuntu 3.12)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: uv run --frozen pytest --cov=buscar --cov-report=term-missing --cov-report=xml --cov-report=html

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Upload HTML coverage artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-html
          path: htmlcov

      - name: Run tests
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.12'
        run: uv run --frozen pytest

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Build package
        run: uv build

      - name: Validate wheel import
        shell: bash
        run: |
          uv pip install --force-reinstall dist/*.whl
          uv run --frozen python -c "import buscar; print(buscar.__name__)"

      # Jobs run on separate runners, so pass the validated distributions to
      # the publish job as an artifact instead of rebuilding them there.
      - name: Upload package distributions
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: python-package-distributions
          path: dist/

  pypi-publish:
    name: Upload release to PyPI
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/buscar
    # Required for PyPI Trusted Publishing. No API token or password is stored
    # in GitHub; PyPI verifies this workflow run through OpenID Connect.
    permissions:
      id-token: write

    steps:
      # Retrieve the exact distributions built and validated by the build job.
      - name: Download package distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@v1.13.0
